apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle7-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle7-app
  template:
    metadata:
      labels:
        app: vle7-app
    spec:
      containers:
      - name: vle7-app
        image: vle7-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: vle7-app-svc
spec:
  type: NodePort
  selector:
    app: vle7-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
